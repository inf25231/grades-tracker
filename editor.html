<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Data Editor – Noten &amp; Module</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .editor-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .nav-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-back-link:hover {
      color: var(--accent-hover);
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .btn {
      font-family: var(--font-system);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      min-height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.2;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--fg);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.12);
      color: #ff453a;
      border-color: rgba(255, 69, 58, 0.25);
    }

    .btn-danger:hover {
      background: rgba(255, 69, 58, 0.22);
    }

    .btn-sm {
      min-height: 32px;
      padding: 0.35rem 0.75rem;
      font-size: 0.785rem;
      border-radius: 6px;
    }

    .btn-icon-only {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .section-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--fg);
    }

    .semesters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 0.75rem;
    }

    .semester-item {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .semester-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--fg-secondary);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--fg-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input, .form-select {
      font-family: var(--font-system);
      font-size: 0.835rem;
      background: var(--bg-inset);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.65rem;
      outline: none;
      transition: all 0.15s ease;
      width: 100%;
      min-height: 34px;
    }

    .form-input:focus, .form-select:focus {
      background: var(--bg-hover);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(41, 151, 255, 0.2);
    }

    .module-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .module-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.75rem;
      gap: 1rem;
    }

    .module-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--fg);
    }

    .module-fields-grid {
      display: grid;
      grid-template-columns: 140px 1fr 110px 90px 130px 105px;
      gap: 0.75rem;
    }

    .sub-exams-container {
      background: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sub-exams-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--fg-secondary);
    }

    .sub-exam-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 115px 90px 85px 85px 36px;
      gap: 0.55rem;
      align-items: end;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sub-exam-row:last-child {
      border-bottom: none;
    }

    .preview-box {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--fg);
      max-height: 400px;
      overflow-y: auto;
      white-space: pre;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-active);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .module-fields-grid {
        grid-template-columns: 1fr 1fr;
      }
      .sub-exam-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .module-fields-grid {
        grid-template-columns: 1fr;
      }
      .sub-exam-row {
        grid-template-columns: 1fr;
      }
      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .action-bar .btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="editor-top-nav">
      <a href="index.html" class="nav-back-link" id="navBackLink">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span id="backText">Noten &amp; Module</span>
      </a>

      <div class="segmented-control lang-toggle" id="langToggle">
        <button class="seg-btn active" data-lang="de">DE</button>
        <button class="seg-btn" data-lang="en">EN</button>
      </div>
    </div>

    <header class="page-header" style="margin-bottom: 1.25rem;">
      <h1 id="pageTitle">Daten-Editor</h1>
    </header>

    <div class="action-bar">
      <button class="btn btn-primary" id="btnDownload">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="btnDownloadText">data.json herunterladen</span>
      </button>

      <button class="btn btn-secondary" id="btnCopy">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="btnCopyText">JSON kopieren</span>
      </button>

      <label class="btn btn-secondary" style="cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span id="btnImportText">JSON laden</span>
        <input type="file" id="fileInput" accept=".json" style="display: none;">
      </label>

      <button class="btn btn-secondary" id="btnAddModule">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span id="btnAddModuleText">Modul hinzufügen</span>
      </button>

      <button class="btn btn-secondary" id="btnTogglePreview">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="btnPreviewText">Vorschau</span>
      </button>
    </div>

    <section class="section-card">
      <div class="section-title">
        <span id="semestersTitle">Semester</span>
        <button class="btn btn-secondary btn-sm" id="btnAddSemester">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span id="btnAddSemesterText">Semester hinzufügen</span>
        </button>
      </div>
      <div class="semesters-grid" id="semestersContainer"></div>
    </section>

    <section id="modulesContainer"></section>

    <section class="section-card" id="previewSection" style="display: none;">
      <div class="section-title">
        <span>JSON Preview</span>
      </div>
      <div class="preview-box" id="jsonPreview"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentLang = localStorage.getItem('lang') || 'de';

    const I18N = {
      de: {
        back: 'Noten & Module',
        title: 'Daten-Editor',
        downloadJson: 'data.json herunterladen',
        copyJson: 'JSON kopieren',
        importJson: 'JSON laden',
        addModule: 'Modul hinzufügen',
        previewJson: 'Vorschau',
        hidePreview: 'Vorschau ausblenden',
        semestersTitle: 'Semester',
        addSemester: 'Semester hinzufügen',
        semesterName: 'Name',
        semesterPeriod: 'Zeitraum',
        moduleCode: 'Modul-Code',
        moduleName: 'Modulbezeichnung',
        semester: 'Semester',
        ects: 'ECTS',
        status: 'Status',
        grade: 'Note',
        statusPassed: 'bestanden',
        statusRecognized: 'anerkannt',
        statusOpen: 'offen',
        subExams: 'Teilleistungen / Prüfungen',
        addExam: 'Prüfung hinzufügen',
        examName: 'Lehrveranstaltung / Prüfung',
        examFormat: 'Prüfungsform',
        examDate: 'Datum',
        examTime: 'Uhrzeit',
        examGrade: 'Note',
        examWeight: 'Gewicht (0.0 – 1.0)',
        deleteModule: 'Modul löschen',
        deleteExam: 'Löschen',
        deleteSemester: 'Löschen',
        copied: 'data.json in die Zwischenablage kopiert!',
        imported: 'JSON-Datei erfolgreich geladen!',
        invalidJson: 'Fehler: Ungültiges JSON-Format.'
      },
      en: {
        back: 'Grades & Modules',
        title: 'Data Editor',
        downloadJson: 'Download data.json',
        copyJson: 'Copy JSON',
        importJson: 'Load JSON',
        addModule: 'Add Module',
        previewJson: 'Preview JSON',
        hidePreview: 'Hide Preview',
        semestersTitle: 'Semesters',
        addSemester: 'Add Semester',
        semesterName: 'Name',
        semesterPeriod: 'Period',
        moduleCode: 'Module Code',
        moduleName: 'Module Title',
        semester: 'Semester',
        ects: 'ECTS',
        status: 'Status',
        grade: 'Grade',
        statusPassed: 'passed',
        statusRecognized: 'recognized',
        statusOpen: 'pending',
        subExams: 'Sub-assessments / Exams',
        addExam: 'Add Exam',
        examName: 'Course / Exam Title',
        examFormat: 'Assessment Format',
        examDate: 'Date',
        examTime: 'Time',
        examGrade: 'Grade',
        examWeight: 'Weight (0.0 – 1.0)',
        deleteModule: 'Delete Module',
        deleteExam: 'Delete',
        deleteSemester: 'Delete',
        copied: 'data.json copied to clipboard!',
        imported: 'JSON file loaded successfully!',
        invalidJson: 'Error: Invalid JSON format.'
      }
    };

    function t(key) {
      const dict = I18N[currentLang] || I18N.de;
      return dict[key] || I18N.de[key] || key;
    }

    let state = {
      semesters: [
        { id: 1, name: "S1", period: "WiSe 25/26" },
        { id: 2, name: "S2", period: "SoSe 26" }
      ],
      modules: [
        {
          code: "CS101",
          name: "Computer Science I",
          semester: 1,
          ects: 5,
          grade: "1.3",
          status: "bestanden",
          subjects: [
            {
              name: "Programming Basics",
              format: "Written Exam (90 min)",
              date: "15.01.2026",
              time: "09:00",
              grade: "1.3",
              weight: 1.0
            }
          ]
        },
        {
          code: "MATH101",
          name: "Linear Algebra",
          semester: 1,
          ects: 5,
          grade: "1.7",
          status: "bestanden",
          subjects: [
            {
              name: "Linear Algebra",
              format: "Written Exam",
              date: "20.01.2026",
              time: "10:00",
              grade: "1.7",
              weight: 1.0
            }
          ]
        }
      ]
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.title = `${t('title')} – ${t('back')}`;
      document.getElementById('backText').textContent = t('back');
      document.getElementById('pageTitle').textContent = t('title');
      document.getElementById('btnDownloadText').textContent = t('downloadJson');
      document.getElementById('btnCopyText').textContent = t('copyJson');
      document.getElementById('btnImportText').textContent = t('importJson');
      document.getElementById('btnAddModuleText').textContent = t('addModule');
      document.getElementById('semestersTitle').textContent = t('semestersTitle');
      document.getElementById('btnAddSemesterText').textContent = t('addSemester');

      const isPreviewOpen = document.getElementById('previewSection').style.display !== 'none';
      document.getElementById('btnPreviewText').textContent = isPreviewOpen ? t('hidePreview') : t('previewJson');

      document.querySelectorAll('#langToggle .seg-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
      });
    }

    function renderSemesters() {
      const container = document.getElementById('semestersContainer');
      container.innerHTML = state.semesters.map((s, idx) => `
        <div class="semester-item">
          <div class="semester-item-header">
            <span>#${s.id}</span>
            <button class="btn btn-danger btn-icon-only" onclick="removeSemester(${idx})" title="${t('deleteSemester')}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
          <div class="form-group">
            <label class="form-label">${t('semesterName')}</label>
            <input type="text" class="form-input" value="${s.name || ''}" placeholder="S1" oninput="updateSemester(${idx}, 'name', this.value)">
          </div>
          <div class="form-group">
            <label class="form-label">${t('semesterPeriod')}</label>
            <input type="text" class="form-input" value="${s.period || ''}" placeholder="WiSe 25/26" oninput="updateSemester(${idx}, 'period', this.value)">
          </div>
        </div>
      `).join('');
    }

    function refreshSemesterDropdowns() {
      document.querySelectorAll('.mod-semester-select').forEach(sel => {
        const mIdx = Number(sel.getAttribute('data-midx'));
        const currentVal = state.modules[mIdx]?.semester;
        sel.innerHTML = state.semesters.map(s => `
          <option value="${s.id}" ${Number(currentVal) === Number(s.id) ? 'selected' : ''}>${s.name || 'S' + s.id}</option>
        `).join('');
      });
    }

    function updateSemester(idx, field, val) {
      state.semesters[idx][field] = val;
      if (field === 'name') {
        refreshSemesterDropdowns();
      }
      updatePreview();
    }

    function addSemester() {
      const nextId = state.semesters.length > 0 ? Math.max(...state.semesters.map(s => s.id)) + 1 : 1;
      state.semesters.push({ id: nextId, name: `S${nextId}`, period: "" });
      renderSemesters();
      refreshSemesterDropdowns();
      updatePreview();
    }

    function removeSemester(idx) {
      state.semesters.splice(idx, 1);
      renderSemesters();
      refreshSemesterDropdowns();
      updatePreview();
    }

    function updateCardHeader(mIdx) {
      const titleEl = document.getElementById(`card-title-${mIdx}`);
      if (titleEl) {
        const m = state.modules[mIdx];
        const code = m.code || 'CODE';
        const name = m.name || t('moduleName');
        titleEl.textContent = `${code} – ${name}`;
      }
    }

    function renderModules() {
      const container = document.getElementById('modulesContainer');
      container.innerHTML = state.modules.map((m, mIdx) => {
        const semesterOptions = state.semesters.map(s => `
          <option value="${s.id}" ${Number(m.semester) === Number(s.id) ? 'selected' : ''}>${s.name || 'S' + s.id}</option>
        `).join('');

        const subRows = (m.subjects || []).map((sub, sIdx) => `
          <div class="sub-exam-row">
            <div class="form-group">
              <label class="form-label">${t('examName')}</label>
              <input type="text" class="form-input" value="${sub.name || ''}" placeholder="${t('examName')}" oninput="updateSubExam(${mIdx}, ${sIdx}, 'name', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">${t('examFormat')}</label>
              <input type="text" class="form-input" value="${sub.format || ''}" placeholder="Klausur / Projekt" oninput="updateSubExam(${mIdx}, ${sIdx}, 'format', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">${t('examDate')}</label>
              <input type="text" class="form-input" value="${sub.date || ''}" placeholder="15.01.2026" oninput="updateSubExam(${mIdx}, ${sIdx}, 'date', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">${t('examTime')}</label>
              <input type="text" class="form-input" value="${sub.time || ''}" placeholder="09:00" oninput="updateSubExam(${mIdx}, ${sIdx}, 'time', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">${t('examGrade')}</label>
              <input type="text" class="form-input" value="${sub.grade || ''}" placeholder="1.3" oninput="updateSubExam(${mIdx}, ${sIdx}, 'grade', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">${t('examWeight')}</label>
              <input type="number" step="0.05" min="0" max="1" class="form-input" value="${sub.weight !== undefined ? sub.weight : 1}" oninput="updateSubExam(${mIdx}, ${sIdx}, 'weight', parseFloat(this.value) || 0)">
            </div>
            <button class="btn btn-danger btn-icon-only" onclick="removeSubExam(${mIdx}, ${sIdx})" title="${t('deleteExam')}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        `).join('');

        return `
          <div class="module-card">
            <div class="module-card-header">
              <div class="module-card-title" id="card-title-${mIdx}">
                ${m.code || 'CODE'} – ${m.name || t('moduleName')}
              </div>
              <button class="btn btn-danger btn-sm" onclick="removeModule(${mIdx})">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span>${t('deleteModule')}</span>
              </button>
            </div>

            <div class="module-fields-grid">
              <div class="form-group">
                <label class="form-label">${t('moduleCode')}</label>
                <input type="text" class="form-input" value="${m.code || ''}" placeholder="CS101" oninput="updateModule(${mIdx}, 'code', this.value)">
              </div>
              <div class="form-group">
                <label class="form-label">${t('moduleName')}</label>
                <input type="text" class="form-input" value="${m.name || ''}" placeholder="Computer Science I" oninput="updateModule(${mIdx}, 'name', this.value)">
              </div>
              <div class="form-group">
                <label class="form-label">${t('semester')}</label>
                <select class="form-select mod-semester-select" data-midx="${mIdx}" onchange="updateModule(${mIdx}, 'semester', parseInt(this.value, 10))">
                  ${semesterOptions}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">${t('ects')}</label>
                <input type="number" class="form-input" value="${m.ects || 5}" oninput="updateModule(${mIdx}, 'ects', parseInt(this.value, 10) || 0)">
              </div>
              <div class="form-group">
                <label class="form-label">${t('status')}</label>
                <select class="form-select" onchange="updateModule(${mIdx}, 'status', this.value)">
                  <option value="bestanden" ${m.status === 'bestanden' ? 'selected' : ''}>${t('statusPassed')}</option>
                  <option value="anerkannt" ${m.status === 'anerkannt' ? 'selected' : ''}>${t('statusRecognized')}</option>
                  <option value="offen" ${m.status === 'offen' ? 'selected' : ''}>${t('statusOpen')}</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">${t('grade')}</label>
                <input type="text" class="form-input" value="${m.grade || ''}" placeholder="1.3" oninput="updateModule(${mIdx}, 'grade', this.value)">
              </div>
            </div>

            <div class="sub-exams-container">
              <div class="sub-exams-header">
                <span>${t('subExams')}</span>
                <button class="btn btn-secondary btn-sm" onclick="addSubExam(${mIdx})">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  <span>${t('addExam')}</span>
                </button>
              </div>
              ${subRows}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateModule(mIdx, field, val) {
      state.modules[mIdx][field] = val;
      if (field === 'code' || field === 'name') {
        updateCardHeader(mIdx);
      }
      updatePreview();
    }

    function addModule() {
      const firstSem = state.semesters.length > 0 ? state.semesters[0].id : 1;
      state.modules.push({
        code: "CS10" + (state.modules.length + 1),
        name: "New Module",
        semester: firstSem,
        ects: 5,
        grade: "",
        status: "bestanden",
        subjects: [
          {
            name: "Course 1",
            format: "Written Exam",
            date: "",
            time: "",
            grade: "",
            weight: 1.0
          }
        ]
      });
      renderModules();
      updatePreview();
    }

    function removeModule(mIdx) {
      state.modules.splice(mIdx, 1);
      renderModules();
      updatePreview();
    }

    function addSubExam(mIdx) {
      state.modules[mIdx].subjects = state.modules[mIdx].subjects || [];
      state.modules[mIdx].subjects.push({
        name: "Course Part",
        format: "Written Exam",
        date: "",
        time: "",
        grade: "",
        weight: 1.0
      });
      renderModules();
      updatePreview();
    }

    function updateSubExam(mIdx, sIdx, field, val) {
      state.modules[mIdx].subjects[sIdx][field] = val;
      updatePreview();
    }

    function removeSubExam(mIdx, sIdx) {
      state.modules[mIdx].subjects.splice(sIdx, 1);
      renderModules();
      updatePreview();
    }

    function getCleanData() {
      return {
        semesters: state.semesters.map(s => ({
          id: Number(s.id),
          name: s.name || `S${s.id}`,
          period: s.period || ""
        })),
        modules: state.modules.map(m => ({
          code: m.code || "",
          name: m.name || "",
          semester: Number(m.semester) || 1,
          ects: Number(m.ects) || 0,
          grade: m.grade || "",
          status: m.status || "bestanden",
          subjects: (m.subjects || []).map(sub => ({
            name: sub.name || "",
            format: sub.format || "",
            date: sub.date || "",
            time: sub.time || "",
            grade: sub.grade || "",
            weight: sub.weight !== undefined ? Number(sub.weight) : 1
          }))
        }))
      };
    }

    function updatePreview() {
      const pre = document.getElementById('jsonPreview');
      if (pre) {
        pre.textContent = JSON.stringify(getCleanData(), null, 2);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      renderSemesters();
      renderModules();
      updatePreview();

      document.getElementById('langToggle').addEventListener('click', (e) => {
        const btn = e.target.closest('.seg-btn');
        if (!btn) return;
        const newLang = btn.getAttribute('data-lang');
        if (newLang === currentLang) return;
        currentLang = newLang;
        localStorage.setItem('lang', currentLang);
        applyTranslations();
        renderSemesters();
        renderModules();
      });

      document.getElementById('btnAddSemester').addEventListener('click', addSemester);
      document.getElementById('btnAddModule').addEventListener('click', addModule);

      document.getElementById('btnTogglePreview').addEventListener('click', () => {
        const sec = document.getElementById('previewSection');
        const isHidden = sec.style.display === 'none';
        sec.style.display = isHidden ? 'block' : 'none';
        document.getElementById('btnPreviewText').textContent = isHidden ? t('hidePreview') : t('previewJson');
        if (isHidden) updatePreview();
      });

      document.getElementById('btnCopy').addEventListener('click', () => {
        const dataStr = JSON.stringify(getCleanData(), null, 2);
        navigator.clipboard.writeText(dataStr).then(() => {
          showToast(t('copied'));
        });
      });

      document.getElementById('btnDownload').addEventListener('click', () => {
        const dataStr = JSON.stringify(getCleanData(), null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (!parsed.modules || !Array.isArray(parsed.modules)) {
              throw new Error('Missing modules');
            }
            state.semesters = Array.isArray(parsed.semesters) ? parsed.semesters : [];
            state.modules = parsed.modules;
            renderSemesters();
            renderModules();
            updatePreview();
            showToast(t('imported'));
          } catch (err) {
            alert(t('invalidJson'));
          }
        };
        reader.readAsText(file);
      });
    });
  </script>
</body>
</html>
