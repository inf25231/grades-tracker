<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Data Editor – Noten &amp; Module</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .editor-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .nav-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-back-link:hover {
      color: var(--accent-hover);
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .btn {
      font-family: var(--font-system);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      min-height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.2;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--fg);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.12);
      color: #ff453a;
      border-color: rgba(255, 69, 58, 0.25);
    }

    .btn-danger:hover {
      background: rgba(255, 69, 58, 0.22);
    }

    .btn-sm {
      min-height: 32px;
      padding: 0.35rem 0.75rem;
      font-size: 0.785rem;
      border-radius: 6px;
    }

    .btn-icon-only {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      justify-content: center;
      border-radius: 6px;
    }

    .section-card, .module-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .module-card {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .section-title, .semester-item-header, .module-card-header, .sub-exams-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--fg);
    }

    .semester-item-header, .sub-exams-header {
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--fg-secondary);
    }

    .semesters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 0.75rem;
    }

    .semester-item {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--fg-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input, .form-select {
      font-family: var(--font-system);
      font-size: 0.835rem;
      background: var(--bg-inset);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.65rem;
      outline: none;
      transition: all 0.15s ease;
      width: 100%;
      min-height: 34px;
    }

    .form-input:focus, .form-select:focus {
      background: var(--bg-hover);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(41, 151, 255, 0.2);
    }

    .module-card-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.75rem;
      gap: 1rem;
    }

    .module-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--fg);
    }

    .module-fields-grid {
      display: grid;
      grid-template-columns: 140px 1fr 110px 90px 130px 105px;
      gap: 0.75rem;
    }

    .sub-exams-container {
      background: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sub-exam-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 115px 90px 85px 85px 36px;
      gap: 0.55rem;
      align-items: end;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sub-exam-row:last-child {
      border-bottom: none;
    }

    .preview-box {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--fg);
      max-height: 400px;
      overflow-y: auto;
      white-space: pre;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-active);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .module-fields-grid, .sub-exam-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .module-fields-grid, .sub-exam-row {
        grid-template-columns: 1fr;
      }
      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .action-bar .btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="editor-top-nav">
      <a href="index.html" class="nav-back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span data-i18n="back">Noten &amp; Module</span>
      </a>

      <div class="segmented-control lang-toggle" id="langToggle">
        <button class="seg-btn active" data-lang="de">DE</button>
        <button class="seg-btn" data-lang="en">EN</button>
      </div>
    </div>

    <header class="page-header" style="margin-bottom: 1.25rem;">
      <h1 data-i18n="title">Daten-Editor</h1>
    </header>

    <div class="action-bar">
      <button class="btn btn-primary" id="btnDownload">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span data-i18n="downloadJson">data.json herunterladen</span>
      </button>

      <button class="btn btn-secondary" id="btnCopy">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span data-i18n="copyJson">JSON kopieren</span>
      </button>

      <label class="btn btn-secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span data-i18n="importJson">JSON laden</span>
        <input type="file" id="fileInput" accept=".json" hidden>
      </label>

      <button class="btn btn-secondary" onclick="addModule()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span data-i18n="addModule">Modul hinzufügen</span>
      </button>

      <button class="btn btn-secondary" id="btnTogglePreview">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="btnPreviewText">Vorschau</span>
      </button>
    </div>

    <section class="section-card">
      <div class="section-title">
        <span data-i18n="semestersTitle">Semester</span>
        <button class="btn btn-secondary btn-sm" onclick="addSemester()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span data-i18n="addSemester">Semester hinzufügen</span>
        </button>
      </div>
      <div class="semesters-grid" id="semestersContainer"></div>
    </section>

    <section id="modulesContainer"></section>

    <section class="section-card" id="previewSection" hidden>
      <div class="section-title">
        <span>JSON Preview</span>
      </div>
      <div class="preview-box" id="jsonPreview"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentLang = localStorage.getItem('lang') || 'de';
    const previewSection = document.getElementById('previewSection');

    const I18N = {
      de: {
        back: 'Noten & Module',
        title: 'Daten-Editor',
        downloadJson: 'data.json herunterladen',
        copyJson: 'JSON kopieren',
        importJson: 'JSON laden',
        addModule: 'Modul hinzufügen',
        previewJson: 'Vorschau',
        hidePreview: 'Vorschau ausblenden',
        semestersTitle: 'Semester',
        addSemester: 'Semester hinzufügen',
        semesterName: 'Name',
        semesterPeriod: 'Zeitraum',
        moduleCode: 'Modul-Code',
        moduleName: 'Modulbezeichnung',
        semester: 'Semester',
        ects: 'ECTS',
        status: 'Status',
        grade: 'Note',
        statusPassed: 'bestanden',
        statusRecognized: 'anerkannt',
        statusOpen: 'offen',
        subExams: 'Teilleistungen / Prüfungen',
        addExam: 'Prüfung hinzufügen',
        examName: 'Lehrveranstaltung / Prüfung',
        examFormat: 'Prüfungsform',
        examDate: 'Datum',
        examTime: 'Uhrzeit',
        examGrade: 'Note',
        examWeight: 'Gewicht (0.0 – 1.0)',
        deleteModule: 'Modul löschen',
        deleteExam: 'Löschen',
        deleteSemester: 'Löschen',
        copied: 'data.json in die Zwischenablage kopiert!',
        imported: 'JSON-Datei erfolgreich geladen!',
        invalidJson: 'Fehler: Ungültiges JSON-Format.'
      },
      en: {
        back: 'Grades & Modules',
        title: 'Data Editor',
        downloadJson: 'Download data.json',
        copyJson: 'Copy JSON',
        importJson: 'Load JSON',
        addModule: 'Add Module',
        previewJson: 'Preview JSON',
        hidePreview: 'Hide Preview',
        semestersTitle: 'Semesters',
        addSemester: 'Add Semester',
        semesterName: 'Name',
        semesterPeriod: 'Period',
        moduleCode: 'Module Code',
        moduleName: 'Module Title',
        semester: 'Semester',
        ects: 'ECTS',
        status: 'Status',
        grade: 'Grade',
        statusPassed: 'passed',
        statusRecognized: 'recognized',
        statusOpen: 'pending',
        subExams: 'Sub-assessments / Exams',
        addExam: 'Add Exam',
        examName: 'Course / Exam Title',
        examFormat: 'Assessment Format',
        examDate: 'Date',
        examTime: 'Time',
        examGrade: 'Grade',
        examWeight: 'Weight (0.0 – 1.0)',
        deleteModule: 'Delete Module',
        deleteExam: 'Delete',
        deleteSemester: 'Delete',
        copied: 'data.json copied to clipboard!',
        imported: 'JSON file loaded successfully!',
        invalidJson: 'Error: Invalid JSON format.'
      }
    };

    function t(key) {
      return I18N[currentLang]?.[key] || I18N.de[key] || key;
    }

    let state = {
      semesters: [
        { id: 1, name: "S1", period: "WiSe 25/26" },
        { id: 2, name: "S2", period: "SoSe 26" }
      ],
      modules: [
        {
          code: "CS101",
          name: "Computer Science I",
          semester: 1,
          ects: 5,
          grade: "1.3",
          status: "bestanden",
          subjects: [
            { name: "Programming Basics", format: "Written Exam (90 min)", date: "15.01.2026", time: "09:00", grade: "1.3", weight: 1.0 }
          ]
        },
        {
          code: "MATH101",
          name: "Linear Algebra",
          semester: 1,
          ects: 5,
          grade: "1.7",
          status: "bestanden",
          subjects: [
            { name: "Linear Algebra", format: "Written Exam", date: "20.01.2026", time: "10:00", grade: "1.7", weight: 1.0 }
          ]
        }
      ]
    };

    const newExam = name => ({ name, format: "Written Exam", date: "", time: "", grade: "", weight: 1.0 });

    const TRASH_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </svg>`;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function field(label, value, onInput, attrs = '') {
      return `<label class="form-group"><span class="form-label">${label}</span><input class="form-input" ${attrs} value="${esc(value)}" oninput="${onInput}"></label>`;
    }

    function select(label, onChange, options) {
      return `<label class="form-group"><span class="form-label">${label}</span><select class="form-select" onchange="${onChange}">${options}</select></label>`;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.title = `${t('title')} – ${t('back')}`;
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
      document.getElementById('btnPreviewText').textContent = t(previewSection.hidden ? 'previewJson' : 'hidePreview');
      document.querySelectorAll('#langToggle .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    }

    function renderSemesters() {
      document.getElementById('semestersContainer').innerHTML = state.semesters.map((s, i) => `
        <div class="semester-item">
          <div class="semester-item-header">
            <span>#${esc(s.id)}</span>
            <button class="btn btn-danger btn-icon-only" onclick="removeSemester(${i})" title="${t('deleteSemester')}">${TRASH_ICON}</button>
          </div>
          ${field(t('semesterName'), s.name, `updateSemester(${i}, 'name', this.value)`, 'placeholder="S1"')}
          ${field(t('semesterPeriod'), s.period, `updateSemester(${i}, 'period', this.value)`, 'placeholder="WiSe 25/26"')}
        </div>
      `).join('');
    }

    const cardTitle = m => `${m.code || 'CODE'} – ${m.name || t('moduleName')}`;

    function renderModules() {
      document.getElementById('modulesContainer').innerHTML = state.modules.map((m, i) => {
        const semesterOptions = state.semesters.map(s =>
          `<option value="${esc(s.id)}" ${Number(m.semester) === Number(s.id) ? 'selected' : ''}>${esc(s.name || 'S' + s.id)}</option>`
        ).join('');
        const statusOptions = [['bestanden', 'statusPassed'], ['anerkannt', 'statusRecognized'], ['offen', 'statusOpen']].map(([value, key]) =>
          `<option value="${value}" ${m.status === value ? 'selected' : ''}>${t(key)}</option>`
        ).join('');

        const subRows = (m.subjects || []).map((sub, j) => {
          const on = f => `updateSubExam(${i}, ${j}, '${f}', this.value)`;
          return `
            <div class="sub-exam-row">
              ${field(t('examName'), sub.name, on('name'), `placeholder="${t('examName')}"`)}
              ${field(t('examFormat'), sub.format, on('format'), 'placeholder="Klausur / Projekt"')}
              ${field(t('examDate'), sub.date, on('date'), 'placeholder="15.01.2026"')}
              ${field(t('examTime'), sub.time, on('time'), 'placeholder="09:00"')}
              ${field(t('examGrade'), sub.grade, on('grade'), 'placeholder="1.3"')}
              ${field(t('examWeight'), sub.weight ?? 1, `updateSubExam(${i}, ${j}, 'weight', parseFloat(this.value) || 0)`, 'type="number" step="0.05" min="0" max="1"')}
              <button class="btn btn-danger btn-icon-only" onclick="removeSubExam(${i}, ${j})" title="${t('deleteExam')}">${TRASH_ICON}</button>
            </div>
          `;
        }).join('');

        return `
          <div class="module-card">
            <div class="module-card-header">
              <div class="module-card-title" id="card-title-${i}">${esc(cardTitle(m))}</div>
              <button class="btn btn-danger btn-sm" onclick="removeModule(${i})">${TRASH_ICON}<span>${t('deleteModule')}</span></button>
            </div>

            <div class="module-fields-grid">
              ${field(t('moduleCode'), m.code, `updateModule(${i}, 'code', this.value)`, 'placeholder="CS101"')}
              ${field(t('moduleName'), m.name, `updateModule(${i}, 'name', this.value)`, 'placeholder="Computer Science I"')}
              ${select(t('semester'), `updateModule(${i}, 'semester', parseInt(this.value, 10))`, semesterOptions)}
              ${field(t('ects'), m.ects ?? 0, `updateModule(${i}, 'ects', parseInt(this.value, 10) || 0)`, 'type="number"')}
              ${select(t('status'), `updateModule(${i}, 'status', this.value)`, statusOptions)}
              ${field(t('grade'), m.grade, `updateModule(${i}, 'grade', this.value)`, 'placeholder="1.3"')}
            </div>

            <div class="sub-exams-container">
              <div class="sub-exams-header">
                <span>${t('subExams')}</span>
                <button class="btn btn-secondary btn-sm" onclick="addSubExam(${i})">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  <span>${t('addExam')}</span>
                </button>
              </div>
              ${subRows}
            </div>
          </div>
        `;
      }).join('');
    }

    function refresh() {
      renderSemesters();
      renderModules();
      updatePreview();
    }

    function updateSemester(i, key, val) {
      state.semesters[i][key] = val;
      // re-render only the modules so the semester input keeps focus; their dropdowns show semester names
      if (key === 'name') renderModules();
      updatePreview();
    }

    function addSemester() {
      const nextId = state.semesters.length > 0 ? Math.max(...state.semesters.map(s => s.id)) + 1 : 1;
      state.semesters.push({ id: nextId, name: `S${nextId}`, period: "" });
      refresh();
    }

    function removeSemester(i) {
      state.semesters.splice(i, 1);
      refresh();
    }

    function updateModule(i, key, val) {
      state.modules[i][key] = val;
      if (key === 'code' || key === 'name') {
        document.getElementById(`card-title-${i}`).textContent = cardTitle(state.modules[i]);
      }
      updatePreview();
    }

    function addModule() {
      state.modules.push({
        code: "CS10" + (state.modules.length + 1),
        name: "New Module",
        semester: state.semesters.length > 0 ? state.semesters[0].id : 1,
        ects: 5,
        grade: "",
        status: "bestanden",
        subjects: [newExam("Course 1")]
      });
      refresh();
    }

    function removeModule(i) {
      state.modules.splice(i, 1);
      refresh();
    }

    function addSubExam(i) {
      (state.modules[i].subjects ||= []).push(newExam("Course Part"));
      refresh();
    }

    function updateSubExam(i, j, key, val) {
      state.modules[i].subjects[j][key] = val;
      updatePreview();
    }

    function removeSubExam(i, j) {
      state.modules[i].subjects.splice(j, 1);
      refresh();
    }

    // normalizes known fields; the spreads keep fields the editor has no inputs for (config, semesterLabel, ...)
    function getCleanData() {
      return {
        ...state,
        semesters: state.semesters.map(s => ({
          ...s,
          id: Number(s.id),
          name: s.name || `S${s.id}`,
          period: s.period || ""
        })),
        modules: state.modules.map(m => ({
          ...m,
          code: m.code || "",
          name: m.name || "",
          semester: Number(m.semester) || 1,
          ects: Number(m.ects) || 0,
          grade: m.grade || "",
          status: m.status || "bestanden",
          subjects: (m.subjects || []).map(sub => ({
            ...sub,
            name: sub.name || "",
            format: sub.format || "",
            date: sub.date || "",
            time: sub.time || "",
            grade: sub.grade || "",
            weight: sub.weight !== undefined ? Number(sub.weight) : 1
          }))
        }))
      };
    }

    const json = () => JSON.stringify(getCleanData(), null, 2);

    function updatePreview() {
      document.getElementById('jsonPreview').textContent = json();
    }

    document.getElementById('langToggle').addEventListener('click', e => {
      const btn = e.target.closest('.seg-btn');
      if (!btn || btn.dataset.lang === currentLang) return;
      currentLang = btn.dataset.lang;
      localStorage.setItem('lang', currentLang);
      applyTranslations();
      refresh();
    });

    document.getElementById('btnTogglePreview').addEventListener('click', () => {
      previewSection.hidden = !previewSection.hidden;
      document.getElementById('btnPreviewText').textContent = t(previewSection.hidden ? 'previewJson' : 'hidePreview');
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      navigator.clipboard.writeText(json()).then(() => showToast(t('copied')));
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([json()], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('fileInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!Array.isArray(parsed.modules)) throw new Error('Missing modules');
          state = { ...parsed, semesters: Array.isArray(parsed.semesters) ? parsed.semesters : [] };
          refresh();
          showToast(t('imported'));
        } catch {
          alert(t('invalidJson'));
        }
      };
      reader.readAsText(file);
    });

    applyTranslations();
    refresh();
  </script>
</body>
</html>
