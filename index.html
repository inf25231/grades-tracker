<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Noten &amp; Module</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <div>
        <h1 data-i18n="title">Noten &amp; Module</h1>
        <p class="subtitle" data-i18n="subtitle">Übersicht der Prüfungsleistungen und Studienmodule</p>
      </div>
      <div class="header-actions">
        <a href="editor.html" class="header-action-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>Editor</span>
        </a>
        <div class="segmented-control lang-toggle" id="langToggle">
          <button class="seg-btn active" data-lang="de">DE</button>
          <button class="seg-btn" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <div class="controls-wrapper">
      <div class="segmented-control" id="viewToggle" role="tablist">
        <button class="seg-btn active" data-view="exams" data-i18n="viewExams">Prüfungen</button>
        <button class="seg-btn" data-view="modules" data-i18n="viewModules">Modulübersicht</button>
      </div>

      <div class="sub-toolbar">
        <div class="segmented-control scrollable" id="semesterToggle">
          <button class="seg-btn active" data-sem="all">Alle</button>
        </div>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Suchen..." autocomplete="off">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-scroll-wrapper" id="contentArea"></div>
    </div>
  </div>

  <script>
    let DB = null;
    let currentView = 'exams';
    let currentSemester = 'all';
    let searchQuery = '';
    let currentLang = localStorage.getItem('lang') || 'de';
    const openModules = new Set();
    const area = document.getElementById('contentArea');
    const searchInput = document.getElementById('searchInput');

    const I18N = {
      de: {
        title: 'Noten & Module',
        subtitle: 'Übersicht der Prüfungsleistungen und Studienmodule',
        viewExams: 'Prüfungen',
        viewModules: 'Modulübersicht',
        all: 'Alle',
        searchPlaceholder: 'Suchen...',
        noData: 'NO DATA',
        noDataSub: 'Keine Daten verfügbar',
        emptyExams: 'Keine Einträge',
        emptyExamsSub: 'Für den gewählten Filter wurden keine Prüfungstermine gefunden.',
        emptyModules: 'Keine Module',
        emptyModulesSub: 'Für den gewählten Filter wurden keine Module gefunden.',
        date: 'Datum',
        time: 'Uhrzeit',
        examCourse: 'Prüfung / Lehrveranstaltung',
        module: 'Modul',
        examFormat: 'Prüfungsform',
        gradeStatus: 'Note / Status',
        modCode: 'Modul-Code',
        modName: 'Modulbezeichnung',
        sem: 'Sem',
        ects: 'ECTS',
        modGrade: 'Modulnote',
        details: 'Details',
        weight: 'Gewicht',
        subAssessment: 'Teilleistung',
        schedule: 'Termin',
        recognized: 'Anerkannt',
        passed: 'bestanden',
        total: 'Gesamt',
        subjectsCount: n => `${n} ${n === 1 ? 'Fach' : 'Fächer'}`,
        assessmentsCount: n => `${n} ${n === 1 ? 'Leistung' : 'Leistungen'}`,
        modulesCount: n => `${n} Module`,
        goToModuleTooltip: 'Moduldetails anzeigen',
        goToExamTooltip: 'Zur Prüfungsterminansicht springen'
      },
      en: {
        title: 'Grades & Modules',
        subtitle: 'Overview of examinations and study modules',
        viewExams: 'Exams',
        viewModules: 'Module Overview',
        all: 'All',
        searchPlaceholder: 'Search...',
        noData: 'NO DATA',
        noDataSub: 'No data available',
        emptyExams: 'No entries',
        emptyExamsSub: 'No examinations found for the selected filter.',
        emptyModules: 'No modules',
        emptyModulesSub: 'No modules found for the selected filter.',
        date: 'Date',
        time: 'Time',
        examCourse: 'Exam / Course',
        module: 'Module',
        examFormat: 'Assessment Format',
        gradeStatus: 'Grade / Status',
        modCode: 'Module Code',
        modName: 'Module Title',
        sem: 'Sem',
        ects: 'ECTS',
        modGrade: 'Module Grade',
        details: 'Details',
        weight: 'Weight',
        subAssessment: 'Sub-assessment',
        schedule: 'Date / Time',
        recognized: 'Recognized',
        passed: 'passed',
        total: 'Total',
        subjectsCount: n => `${n} ${n === 1 ? 'Course' : 'Courses'}`,
        assessmentsCount: n => `${n} ${n === 1 ? 'Assessment' : 'Assessments'}`,
        modulesCount: n => `${n} Modules`,
        goToModuleTooltip: 'Show module details',
        goToExamTooltip: 'Jump to exam schedule'
      }
    };

    function t(key, arg) {
      const val = I18N[currentLang]?.[key] || I18N.de[key] || key;
      return typeof val === 'function' ? val(arg) : val;
    }

    function applyStaticTranslations() {
      document.documentElement.lang = currentLang;
      document.title = t('title');
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
      searchInput.placeholder = t('searchPlaceholder');
      document.querySelectorAll('#langToggle .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    }

    function activate(btn) {
      btn.parentNode.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b === btn));
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function encodeSubjectId(name) {
      return String(name || '').replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    // "dd.mm.yyyy" or "mm.yyyy" (mid-month); unknown dates sort last
    function parseDateForSort(dateStr) {
      const m = String(dateStr || '').trim().match(/^(?:(\d{1,2})\.)?(\d{1,2})\.(\d{4})/);
      return m ? new Date(m[3], m[2] - 1, m[1] ?? 15).getTime() : 9999999999999;
    }

    function parseTimeForSort(timeStr) {
      const m = String(timeStr || '').match(/^(\d{1,2}):(\d{2})/);
      return m ? m[1] * 60 + Number(m[2]) : 0;
    }

    function getGradeColors(gradeStr) {
      const num = parseFloat(String(gradeStr).replace(',', '.'));
      if (!gradeStr || isNaN(num)) return null;

      let hue;
      if (num <= 1.0) hue = 140;
      else if (num <= 2.0) hue = 140 - (num - 1.0) * 40;
      else if (num <= 3.0) hue = 100 - (num - 2.0) * 48;
      else if (num <= 4.0) hue = 52 - (num - 3.0) * 30;
      else hue = Math.max(4, 22 - (num - 4.0) * 18);

      const hsl = `${Math.round(hue)}, 78%, 56%`;
      return { color: `hsl(${hsl})`, bg: `hsla(${hsl}, 0.12)`, border: `hsla(${hsl}, 0.28)` };
    }

    function badge(inner, colors) {
      return colors
        ? `<div class="status-badge" style="color: ${colors.color}; background-color: ${colors.bg}; border: 1px solid ${colors.border};">${inner}</div>`
        : `<div class="status-badge status-grade">${inner}</div>`;
    }

    function renderStatus(grade, status) {
      const st = String(status || '').toLowerCase();
      const gr = grade && !['anerkannt', 'recognized'].includes(String(grade).toLowerCase()) ? String(grade).trim() : '';
      const colors = getGradeColors(gr);

      if (st.includes('anerkannt') || st.includes('recognized')) {
        return badge(`<span>${t('recognized')}</span>` + (colors ? `<span class="font-semibold">(${esc(gr)})</span>` : ''), colors);
      }
      if ((st.includes('bestanden') || st.includes('passed')) && !gr) {
        return badge(`<span>${t('passed')}</span>`);
      }
      if (gr && gr !== 'offen' && gr !== 'pending') {
        return badge(`<span class="font-semibold">${esc(gr)}</span>`, colors);
      }
      return `<span class="tabular text-tertiary" style="font-size: 0.85rem;">–</span>`;
    }

    function allExams() {
      return (DB.modules || []).flatMap(mod => (mod.subjects || []).map(s => ({
        ...s,
        moduleCode: mod.code,
        moduleName: mod.name,
        semester: s.semester != null ? Number(s.semester) : Number(mod.semester)
      })));
    }

    // switch view, clear search, drop a semester filter that would hide the target, then scroll to and flash its row
    function jumpTo(view, rowId, semesters) {
      currentView = view;
      activate(document.querySelector(`#viewToggle [data-view="${view}"]`));
      searchQuery = '';
      searchInput.value = '';
      if (semesters && currentSemester !== 'all' && !semesters.includes(Number(currentSemester))) {
        currentSemester = 'all';
        activate(document.querySelector('#semesterToggle [data-sem="all"]'));
      }
      render();
      const el = document.getElementById(rowId);
      el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el?.classList.add('highlight-glow');
    }

    function goToModule(code) {
      const mod = (DB.modules || []).find(m => m.code === code);
      jumpTo('modules', 'mod-row-' + code, mod && (mod.semesters || [mod.semester]));
    }

    function goToExam(name) {
      const exam = allExams().findLast(e => e.name === name);
      jumpTo('exams', 'exam-row-' + encodeSubjectId(name), exam?.semester ? [exam.semester] : null);
    }

    function emptyState(key, size, icon) {
      return `
        <div class="empty-container">
          <div class="empty-icon">
            <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${icon}</svg>
          </div>
          <div class="empty-title">${t(key)}</div>
          <div class="empty-subtitle">${t(key + 'Sub')}</div>
        </div>
      `;
    }

    const SEARCH_ICON = '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>';

    async function loadData() {
      const filesToTry = currentLang === 'en'
        ? ['./data.en.json', './data.example.en.json', './data.json', './data.example.json']
        : ['./data.json', './data.example.json'];

      DB = null;
      for (const file of filesToTry) {
        try {
          const res = await fetch(file, { cache: 'no-store' });
          if (res.ok) { DB = await res.json(); break; }
        } catch {}
      }

      if (!DB) {
        area.innerHTML = emptyState('noData', 42, '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>');
        return;
      }

      const sems = [{ id: 'all', name: t('all') }, ...(DB.semesters || []).map(s => ({ id: s.id, name: s.name || `S${s.id}` }))];
      document.getElementById('semesterToggle').innerHTML = sems.map(s =>
        `<button class="seg-btn ${String(currentSemester) === String(s.id) ? 'active' : ''}" data-sem="${esc(s.id)}">${esc(s.name)}</button>`
      ).join('');
      render();
    }

    // calls rowsHtml(semesterKey, items, headerRow) for each semester, in semester order
    function bySemester(items, countKey, rowsHtml) {
      const groups = {};
      items.forEach(i => (groups[i.semester] ||= []).push(i));
      return Object.keys(groups).sort((a, b) => a - b).map(key => {
        const sem = (DB.semesters || []).find(s => s.id == key) || { name: `S${key}` };
        const title = sem.period ? `${esc(sem.name)} ${esc(sem.period)}` : esc(sem.name);
        const header = `<tr class="semester-group-header"><td colspan="6">${title} (${t(countKey, groups[key].length)})</td></tr>`;
        return rowsHtml(groups[key], header);
      }).join('');
    }

    const ths = keys => keys.map(k => `<th>${t(k)}</th>`).join('');

    function renderExams() {
      const q = searchQuery;
      const filtered = allExams().filter(item =>
        (currentSemester === 'all' || item.semester === Number(currentSemester)) &&
        (!q || [item.name, item.moduleCode, item.moduleName, item.format, item.grade, item.date]
          .some(v => v && String(v).toLowerCase().includes(q)))
      );

      if (filtered.length === 0) return emptyState('emptyExams', 36, SEARCH_ICON);

      return `
        <table class="tbl-exams">
          <colgroup>
            <col class="c-date"><col class="c-time"><col><col class="c-mod"><col class="c-form"><col class="c-grade">
          </colgroup>
          <thead>
            <tr>${ths(['date', 'time', 'examCourse', 'module', 'examFormat', 'gradeStatus'])}</tr>
          </thead>
          <tbody>
            ${bySemester(filtered, 'assessmentsCount', (rows, header) => header + rows
              .sort((a, b) => (parseDateForSort(a.date) - parseDateForSort(b.date)) || (parseTimeForSort(a.time) - parseTimeForSort(b.time)))
              .map(r => `
                <tr class="main-row" id="exam-row-${encodeSubjectId(r.name)}">
                  <td class="tabular font-semibold cell-nowrap">${esc(r.date)}</td>
                  <td class="tabular text-secondary cell-nowrap">${esc(r.time)}</td>
                  <td class="font-semibold cell-wrap">${esc(r.name)}</td>
                  <td class="cell-nowrap">
                    <button class="code-link tabular" data-code="${esc(r.moduleCode)}" onclick="goToModule(this.dataset.code)" title="${esc(r.moduleName)} &rarr; ${t('goToModuleTooltip')}">
                      ${esc(r.moduleCode)}
                    </button>
                  </td>
                  <td class="cell-nowrap"><span class="format-pill">${esc(r.format)}</span></td>
                  <td class="cell-nowrap">${renderStatus(r.grade, r.status)}</td>
                </tr>
              `).join(''))}
          </tbody>
        </table>
      `;
    }

    function renderModules() {
      const q = searchQuery;
      const filtered = (DB.modules || []).filter(mod =>
        (currentSemester === 'all' || (mod.semesters || [mod.semester]).includes(Number(currentSemester))) &&
        (!q || [mod.code, mod.name, mod.grade, ...(mod.subjects || []).map(s => s.name)]
          .some(v => v && String(v).toLowerCase().includes(q)))
      );

      if (filtered.length === 0) return emptyState('emptyModules', 36, SEARCH_ICON);

      const examLink = name => `onclick="goToExam(this.dataset.name)" data-name="${esc(name)}" title="${t('goToExamTooltip')}"`;

      const moduleRows = m => {
        const subjects = m.subjects || [];
        const isOpen = openModules.has(m.code);

        const subRows = subjects.map(s => `
          <tr>
            <td class="cell-nowrap">${s.weight ? `<span class="weight-tag tabular">${Math.round(s.weight * 100)}%</span>` : ''}</td>
            <td class="cell-wrap">
              ${m.semesters?.length > 1 && s.semester ? `<span class="sem-tag tabular">S${esc(s.semester)}</span> ` : ''}
              <button class="subj-link" ${examLink(s.name)}>
                <span>${esc(s.name)}</span>
                <svg class="subj-link-icon" viewBox="0 0 16 16" fill="currentColor">
                  <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                </svg>
              </button>
            </td>
            <td class="cell-nowrap"><span class="format-pill">${esc(s.format)}</span></td>
            <td class="tabular text-secondary cell-nowrap">${esc(s.date)} ${esc(s.time)}</td>
            <td class="cell-nowrap" style="text-align: right;">${renderStatus(s.grade, s.status)}</td>
          </tr>
        `).join('');

        const actionBtn = subjects.length > 1
          ? `<button class="expand-btn ${isOpen ? 'open' : ''}" data-code="${esc(m.code)}" onclick="toggleModule(this.dataset.code)">
               <span>${t('subjectsCount', subjects.length)}</span>
               <svg class="chevron" viewBox="0 0 12 12"><path d="M4 2.5L7.5 6L4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
             </button>`
          : `<button class="action-arrow-btn" ${examLink(subjects[0]?.name || m.name)}>
               <svg viewBox="0 0 12 12"><path d="M4.5 2.5L8 6L4.5 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
             </button>`;

        return `
          <tr class="main-row" id="mod-row-${esc(m.code)}">
            <td class="tabular font-semibold cell-nowrap">${esc(m.code)}</td>
            <td class="font-semibold cell-nowrap">${esc(m.name)}</td>
            <td class="tabular text-secondary cell-nowrap">${esc(m.semesterLabel || `S${m.semester}`)}</td>
            <td class="tabular cell-nowrap">${esc(m.ects)} ECTS</td>
            <td class="cell-nowrap">${renderStatus(m.grade, m.status)}</td>
            <td class="cell-action">${actionBtn}</td>
          </tr>
          <tr class="details-row ${isOpen ? 'open' : ''}">
            <td colspan="6">
              <div class="sub-table-container">
                <table class="sub-table">
                  <colgroup>
                    <col style="width: 55px;"><col><col style="width: 230px;"><col style="width: 160px;"><col style="width: 135px;">
                  </colgroup>
                  <thead>
                    <tr>${ths(['weight', 'subAssessment', 'examFormat', 'schedule'])}<th style="text-align: right;">${t('gradeStatus')}</th></tr>
                  </thead>
                  <tbody>${subRows}</tbody>
                </table>
              </div>
            </td>
          </tr>
        `;
      };

      const totalEcts = filtered.reduce((acc, m) => acc + (Number(m.ects) || 0), 0);
      return `
        <table class="tbl-modules">
          <colgroup>
            <col class="c-code"><col><col class="c-sem"><col class="c-ects"><col class="c-grade"><col class="c-action">
          </colgroup>
          <thead>
            <tr>${ths(['modCode', 'modName', 'sem', 'ects', 'modGrade'])}<th class="cell-action">${t('details')}</th></tr>
          </thead>
          <tbody>
            ${bySemester(filtered, 'modulesCount', (mods, header) => header + mods.map(moduleRows).join(''))}
          </tbody>
          <tfoot>
            <tr class="summary-row">
              <td colspan="3" class="font-semibold text-secondary" style="text-align: right;">${t('total')}</td>
              <td class="tabular font-semibold cell-nowrap">&Sigma; ${totalEcts} ECTS</td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      `;
    }

    function toggleModule(code) {
      openModules.has(code) ? openModules.delete(code) : openModules.add(code);
      render();
    }

    function render() {
      if (DB) area.innerHTML = currentView === 'exams' ? renderExams() : renderModules();
    }

    function onSegClick(id, handler) {
      document.getElementById(id).addEventListener('click', e => {
        const btn = e.target.closest('.seg-btn');
        if (btn) handler(btn);
      });
    }

    onSegClick('langToggle', btn => {
      if (btn.dataset.lang === currentLang) return;
      currentLang = btn.dataset.lang;
      localStorage.setItem('lang', currentLang);
      applyStaticTranslations();
      loadData();
    });

    onSegClick('viewToggle', btn => {
      activate(btn);
      currentView = btn.dataset.view;
      render();
    });

    onSegClick('semesterToggle', btn => {
      activate(btn);
      currentSemester = btn.dataset.sem;
      render();
    });

    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value.trim().toLowerCase();
      render();
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        e.target.value = '';
        searchQuery = '';
        render();
      }
    });

    applyStaticTranslations();
    loadData();
  </script>
</body>
</html>
